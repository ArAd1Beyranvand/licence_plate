[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "license_plate"
version = "0.1.0"
description = "Licence plates of 182 countries in one package, for plate_core."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["licence plate", "license plate", "vehicle registration", "validation"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Typing :: Typed"]
dependencies = ["plate_core>=0.1.0"]

