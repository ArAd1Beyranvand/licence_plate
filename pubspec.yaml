name: license_plate
description: "Every licence plate in one Flutter package: the plate_core engine, alphabets, an on-screen keypad and 182 countries' plates."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/licence_plate

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.0
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
